name: Avalonia

on:
  push:
    branches: [main]
    paths:
      - "dotnet-avalonia/**"
      - ".github/workflows/avalonia.yml"
  pull_request:
    paths:
      - "dotnet-avalonia/**"
      - ".github/workflows/avalonia.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dotnet-avalonia

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet build dnd.csproj
