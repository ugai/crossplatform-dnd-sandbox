name: Iced

on:
  push:
    branches: [main]
    paths:
      - "rust-iced/**"
      - ".github/workflows/iced.yml"
  pull_request:
    paths:
      - "rust-iced/**"
      - ".github/workflows/iced.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust-iced

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rfd uses GTK 3 for its file dialog on Linux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-iced
      - run: cargo build --locked
