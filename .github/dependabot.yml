version: 2

# One grouped PR per folder and ecosystem per week, to keep the noise down.
# Security updates are grouped separately, since they arrive outside the schedule.
updates:
  - package-ecosystem: bun
    directory: /electron
    schedule:
      interval: weekly
    groups:
      electron:
        patterns: ["*"]
      electron-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /tauri
    schedule:
      interval: weekly
    groups:
      tauri-frontend:
        patterns: ["*"]
      tauri-frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /tauri/src-tauri
    schedule:
      interval: weekly
    groups:
      tauri-backend:
        patterns: ["*"]
      tauri-backend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /rust-iced
    schedule:
      interval: weekly
    groups:
      iced:
        patterns: ["*"]
      iced-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /dotnet-avalonia
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["*"]
      avalonia-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
